syntax = "proto3";

package pb;

option go_package = "/internal/gen/grpc;pb";

service AccountService {
    rpc CreateAccount(CreateAccountRequest) returns (CreateAccountReply) {};
    rpc GetAccount(GetAccountRequest) returns (GetAccountReply) {};
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenReply) {};
    rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenReply) {};
    rpc Login(LoginRequest) returns (LoginReply) {};
    rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailReply) {};
    rpc ResendEmailConfirmation(ResendEmailConfirmationRequest) returns (ResendEmailConfirmationReply) {};
}

message Account {
    string id = 1;         
	string email = 2;
	int64 organization_id = 3;
	bool confirmed = 4;
	bool blocked = 5;
}

message VerifyTokenRequest {
    string token = 1;
}

message VerifyTokenReply {
    string account_id = 1;
	int64 organization_id = 2;
}

message RefreshTokenRequest {
    string token = 1;
    string refresh_token = 2;
}

message RefreshTokenReply {
    string token = 1;
    string refresh_token = 2;
}

message CreateAccountRequest {
    string email = 1;
    string password = 2;
	int64 organization_id = 3;
    string idempotency_key = 4;
}

message CreateAccountReply {
    Account account = 1;
    string token = 2;
    string refresh_token = 3;
}

message GetAccountRequest {
    oneof identifier {
        string id = 1;
        string telegram_id = 2;
    }

	int64 organization_id = 3;

    enum ErrorCode {
        ERROR_CODE_UNSPECIFIED = 0;
        ACCOUNT_NOT_FOUND = 1;
    }
}

message GetAccountReply {
    Account account = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
    int64 organization_id = 3;
}

message LoginReply {
    Account account = 1;
    string token = 2;
    string refresh_token = 3;
}

message ConfirmEmailRequest {
    string confirmation_token = 1;
}

message ConfirmEmailReply {}

message ResendEmailConfirmationRequest {
    string account_id = 1;
    int64 organization_id = 2;
}

message ResendEmailConfirmationReply {}